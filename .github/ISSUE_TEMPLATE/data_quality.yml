name: Data quality issue
description: A data contract, audit or reconciliation finding about the dataset or derived tables.
labels: ["data-quality"]
body:
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: Which check (dbt test, audit, reconciliation) and which rows or columns.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Command, output, and the expected value according to the contract.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact on the evidence
      description: Does it affect the frozen results, the Power BI layer, or only tooling?
    validations:
      required: true
