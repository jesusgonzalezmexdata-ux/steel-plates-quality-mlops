name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Syntax lint
        run: python -B -m tools.project_checks lint
      - name: Frozen data and evidence checks
        run: python -B -m tools.project_checks validate-data
      - name: Full tests (includes historical training regression and OOF replay)
        run: python -B -m pytest -q
      - run: python -B -m tools.project_checks validate-artifact
      - run: python -B -m tools.project_checks batch-smoke
      - run: python -B -m tools.project_checks validate-evidence
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t steel-plates-quality-mlops .
      - name: Evidence checks in container
        run: docker run --rm steel-plates-quality-mlops
      - name: Full tests in container
        run: docker run --rm steel-plates-quality-mlops python -B -m pytest -q -p no:cacheprovider
  data-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: requirements-dbt.txt
      - run: pip install -r requirements-dbt.txt
      - name: dbt build and reconciliation with the Python audit
        run: python -B -m tools.data_contract
      - name: Contract tests (including corruption cases)
        run: python -B -m pytest -q -p no:cacheprovider tests/test_data_contract.py
  onnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: requirements-onnx.txt
      - run: pip install -r requirements-onnx.txt
      - name: Export ONNX and verify byte identity and equivalence
        run: python -B -m tools.export_onnx --check
      - name: ONNX tests
        run: python -B -m pytest -q -p no:cacheprovider tests/test_onnx_export.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node.js inference through ONNX Runtime
        working-directory: examples/onnx-node
        run: |
          npm ci --no-audit --no-fund
          node predict.mjs
