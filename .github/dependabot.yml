version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    ignore:
      # Frozen scientific environment: the model artifact refuses other versions
      # (see artifacts/manifest.json). Upgrading these is a deliberate, separate decision.
      - dependency-name: "scikit-learn"
      - dependency-name: "numpy"
      - dependency-name: "pandas"
      - dependency-name: "scipy"
      - dependency-name: "joblib"
      - dependency-name: "matplotlib"
  - package-ecosystem: npm
    directory: "/examples/onnx-node"
    schedule:
      interval: weekly
    labels: ["dependencies"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
