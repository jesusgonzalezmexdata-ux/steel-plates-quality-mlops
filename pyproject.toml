[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-plates-quality-mlops"
version = "1.4.0"
description = "Full-observation steel defect classification and reproducible evidence"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jesús R. L. González" }]
readme = "README.md"
dynamic = ["dependencies"]

[project.scripts]
steel-predict = "quality_ml.inference.predict:main"

[project.urls]
Repository = "https://github.com/jesusgonzalezmexdata-ux/steel-plates-quality-mlops"
Changelog = "https://github.com/jesusgonzalezmexdata-ux/steel-plates-quality-mlops/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]